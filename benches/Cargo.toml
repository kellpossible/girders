[package]
name = "girders-benches"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
girders = { path = "../girders" }
girders-json = { path = "../girders-json" }
girders-cbor = { path = "../girders-cbor" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# CBOR baselines: ciborium is the common serde choice, cbor4ii a maintained, fast one.
ciborium = "0.2.2"
cbor4ii = { version = "1.2.4", features = ["serde1", "use_std"] }

[dev-dependencies]
gungraun = "0.20.0"

[[bench]]
name = "runtime"
harness = false

[lints]
workspace = true

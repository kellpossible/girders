[package]
name = "girders-json"
description = "Strict JSON format for girders: streaming reader, serializer, Value tree, pointer, diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# io::Read/io::Write entry points and HashMap-backed Value.
std = ["girders/std"]

[dependencies]
girders = { version = "0.1.0", path = "../girders", default-features = false }
# Keyed hashing for the large-object index (see `value`): the one exception to
# zero dependencies, so the security-relevant hash is a vetted implementation.
siphasher = { version = "1.0.4", default-features = false }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

[lints]
workspace = true

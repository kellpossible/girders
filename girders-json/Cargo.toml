[package]
name = "girders-json"
description = "Strict JSON format for girders: streaming reader, serializer, Value tree, pointer, diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
# io::Read/io::Write entry points and HashMap-backed Value.
std = ["girders/std"]

[dependencies]
girders = { path = "../girders", default-features = false }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["girders", "girders-json", "girders-cbor", "benches"]
exclude = ["spikes", "bench-fixtures"]

[workspace.package]
version = "0.1.0"
rust-version = "1.88"
repository = "https://github.com/kellpossible/girders"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.bench]
debug = true
